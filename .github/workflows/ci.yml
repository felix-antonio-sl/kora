name: CI

# Verifica portabilidad efectiva: matriz Linux x macOS con Python 3.12.
# Sin esta verificacion, la portabilidad es conjetura — sólo aqui se
# materializa como invariante observable.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  kora-verify:
    name: kora check + unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Index catalog
        run: python3 toolchain/kora index

      - name: Run kora check --strict
        run: python3 toolchain/kora check --strict

      - name: Run unittest suite
        run: python3 -m unittest discover -s tests

      - name: Verify kb-graph is clean
        run: |
          python3 toolchain/kora kb-graph --json --orphans > /dev/null
          python3 -c "
          import json, sys
          data = json.loads(open('docs/generated/kb-graph.json').read())
          orphans_real = len(data.get('orphans_real', []))
          broken = len(data.get('broken_edges', []))
          if orphans_real != 0 or broken != 0:
              print(f'kb-graph drift: orphans_real={orphans_real} broken_edges={broken}')
              sys.exit(1)
          print(f'kb-graph OK: orphans_real=0 broken_edges=0')
          "
